<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Latent Model Organizer - Starting...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --color-bg-canvas: #0A0A0D;
            --color-surface-1: #14151B;
            --color-border-default: rgba(255, 255, 255, 0.10);
            --color-border-subtle: rgba(255, 255, 255, 0.06);
            --color-text-primary: #F2F3F7;
            --color-text-secondary: #9294A3;
            --color-text-tertiary: #6F7180;
            --gradient-brand: linear-gradient(135deg, #4FD8D0 0%, #9B7EF5 100%);
            --gradient-brand-text: linear-gradient(90deg, #67E0D8 0%, #9B7EF5 100%);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--color-bg-canvas);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(79, 216, 208, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(155, 126, 245, 0.05) 0%, transparent 45%);
            color: var(--color-text-primary);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-app-region: drag;
            border: 1px solid var(--color-border-default);
            border-radius: 16px;
            overflow: hidden;
        }

        .splash-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 24px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 16px rgba(79, 216, 208, 0.2));
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--gradient-brand-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text-secondary);
            margin-bottom: 28px;
        }

        .loader-track {
            width: 220px;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--color-border-subtle);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .loader-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 45%;
            background: var(--gradient-brand);
            border-radius: 999px;
            animation: splash-load 1.6s infinite ease-in-out;
        }

        @keyframes splash-load {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(230%);
            }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
            <defs>
                <linearGradient id="splash-g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#67E0D8"></stop>
                    <stop offset="100%" stop-color="#9B7EF5"></stop>
                </linearGradient>
            </defs>
            <rect x="4" y="4" width="192" height="192" rx="56" fill="url(#splash-g)"></rect>
            <path d="M 76 56 L 76 144 L 140 144" fill="none" stroke="#06101A" stroke-opacity="0.35" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M 76 56 L 76 144 L 140 144" fill="none" stroke="#F7F8FB" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <h1 class="title">Latent Model Organizer</h1>
        <div class="subtitle">Waking up the Java Engine...</div>
        <div class="loader-track">
            <div class="loader-fill"></div>
        </div>
    </div>
</body>
</html>
